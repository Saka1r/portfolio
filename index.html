<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sakair@portfolio</title>
    <style>
        /* === CSS STYLES === */
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.5;
        }

        #output {
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        #output a {
            color: #58a6ff;
            text-decoration: none;
        }
        #output a:hover {
            text-decoration: underline;
        }

        .input-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .prompt {
            color: #ff7b72;
            margin-right: 8px;
            white-space: nowrap;
        }

        .input-wrapper {
            display: flex;
            flex-grow: 1;
            align-items: center;
            min-width: 0;
            position: relative;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: inherit;
            font-size: inherit;
            width: 100%;
            outline: none;
            caret-color: transparent;
            min-width: 50px;
            padding-right: 12px;
        }
        
        .cursor {
            position: absolute;
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff41;
            animation: blink 1s step-end infinite;
            pointer-events: none;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes blink { 50% { opacity: 0; } }
        
        .command-history {
            color: #8b949e;
            margin: 2px 0;
        }

        /* Анимация появления тянки */
        .ascii-art {
            color: #ff79c6;
            line-height: 1.1;
            display: inline-block;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .welcome-text {
            color: #58a6ff;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            body { font-size: 14px; padding: 10px; }
            .prompt { font-size: 14px; }
            .ascii-art { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="output"></div>
    
    <div class="input-line">
        <span class="prompt">sakair@portfolio:~$</span>
        <div class="input-wrapper">
            <input type="text" id="command-input" autocomplete="off" autofocus>
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        // === JS LOGIC ===
        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        // История команд (глобальные переменные)
        let commandHistory = [];
        let historyIndex = -1;

        // ASCII-арт
        const catgirlArt = `<span class="ascii-art">
  /\\_/\\
 ( o.o )
 /|   |\\
(_|   |_)
  U   U
</span>`;

        const welcomeText = `<span class="welcome-text">
<b>★ sakair@portfolio terminal ★</b>
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
 Welcome, guest! 
 Type <span style="color:#ff7b72">"help"</span> to begin your journey.
 
━━━━━━━━━━━━━━━━━━━━━━━━━━━━</span>`;

        // База команд 
        const commands = {
            'about': 'Student (10th->11th grade) interested in CS & TechPhys.<br>Programming since ~2021: from python and visual scripting to C/Rust.<br><br>I love to study and create<br>I enjoy understanding how systems work and building small projects to learn.',
            
            'skills': '<b>Languages:</b> C (K&R), Python, Rust (learning), Bash<br><b>Concepts:</b> Algorithms, Git, RISC-V basics<br><b>Systems:</b> Arch Linux, CLI workflows<br><b>Hardware:</b> ESP32, RPi, 3D printing<br><i>Always learning something new.</i>',
            
            'projects': '1. <a href="https://github.com/Saka1r/fu" target="_blank">fu</a> — Learning project: exploring VCS internals in C++<br>2. <a href="https://github.com/Saka1r/Jarvis" target="_blank">Jarvis</a> — Experimenting with local voice assistants (Python)<br>3. <a href="https://github.com/Saka1r/School_project_cpu" target="_blank">Chip-8</a> — Simple emulator in Rust to understand CPU basics<br><a href="https://github.com/Saka1r/brainfuck" target="_blank">brainfuck</a> — Brainfuck minimal interpreter written in x86_64 assembly (NASM). No libc, pure Linux syscalls.</i><br>All projects are educational — code may be messy 😅',
            
            'education': '🎓 School: 10th grade, focus on math & physics<br>🔬 Kvantorium: 2 years, learned teamwork & project basics<br>📚 Self-study: "The C Programming Language", "Grokking Algorithms", RISC-V docs<br>',
            
            'hardware': '🐧 Daily driver: Arch Linux + Hyprland<br>📦 Boards: Orange Pi Zero 3, Raspberry Pi Zero 2W<br>🎮 Microcontrollers: ESP32, Arduino (for fun projects)<br>🖨 3D Printing: Modeling & printing parts for my setups',
            
            'security': '🔐 Interest: Cybersecurity fundamentals<br>🧰 Learning: nmap, Wireshark basics, network protocols, <br>⚠️ All experiments are in isolated lab environments only.',
            
            'books': '📖 Finished: "Grokking Algorithms", "The C Programming Language" (K&R)<br>📖 Reading: "Rust in Action", "Digital Circuitry and Computer Architecture", "Clean Code"<br>📖 Next: "Programming World: Algorithms", "Assembly and the x86 Digital Model"',

            'whoami': 'sakair - Future physicist, engineer, and part-time superhero.',
            'hobbies': '🎸 Playing electric guitar',
            'su': 'Authentication failure: You need to write more C code to gain root privileges.',
            'ping': 'PONG! Latency: 1ms. The connection to the mainframe is stable.',
            
            'neofetch': `
       /\\      sakair@portfolio
      /  \\     ----------------
     /    \\    OS: Arch Linux
    /------\\   Host: Student Laptop
   /|      |\\  Kernel: Learning Mode
  / |      | \\ Uptime: 16 years
    |      |   Packages: 4->5y coding journey
    |      |   Shell: bash
    |______|   Resolution: Growing Daily
                DE: Hyprland
                WM: i3-like vibes
            `,

            'catgirl': catgirlArt + '<br><i style="color:#ff79c6">nya~ welcome back, senpai! 🐱</i>',
            
            'contact': '📧 Email: sakairlinux@gmail.com<br>🐙 GitHub: <a href="https://github.com/Saka1r" target="_blank">github.com/Saka1r</a><br><i>Always open to feedback and learning from others.</i>',
            
            'help': 'Available commands:<br>• about, skills, projects<br>• education, hardware, security<br>• books, contact, neofetch<br>• catgirl, clear, help',
            
            'clear': '__CLEAR__',
            'sudo': 'Nice try! But this system runs on humility mode 😊',
            'matrix': 'Wake up, Neo... (Just kidding, but have a nice day!)',
            'exit': 'You cannot leave. The learning never stops. 🔁'
        };

        // Приветствие при загрузке (с тянкой!)
        window.onload = () => {
            const container = document.createElement('div');
            container.className = 'welcome-container';
            container.innerHTML = catgirlArt + '<div>' + welcomeText + '</div>';
            output.appendChild(container);
            printLine('');
            updateCursorPosition();
        };

        // Функция вывода строки
        function printLine(text, isCommand = false) {
            const line = document.createElement('div');
            if (isCommand) {
                line.className = 'command-history';
                line.innerHTML = `<span class="prompt">sakair@portfolio:~$</span> ${text}`;
            } else {
                line.innerHTML = text;
            }
            output.appendChild(line);
            scrollToBottom();
        }

        // Прокрутка вниз
        function scrollToBottom() {
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Обновление позиции курсора (теперь через left + textWidth)
        function updateCursorPosition() {
            const cursor = document.querySelector('.cursor');
            const inputRect = input.getBoundingClientRect();
            const wrapperRect = input.parentElement.getBoundingClientRect();
            const textWidth = getTextWidth(input.value, input);
            
            // Позиция = смещение input внутри wrapper + ширина текста
            const leftPos = (inputRect.left - wrapperRect.left) + textWidth;
            cursor.style.left = leftPos + 'px';
            cursor.style.right = 'auto';
        }

        // Вычисление ширины текста через canvas
        function getTextWidth(text, element) {
            const canvas = getTextWidth.canvas || (getTextWidth.canvas = document.createElement('canvas'));
            const context = canvas.getContext('2d');
            context.font = getComputedStyle(element).font;
            return context.measureText(text).width;
        }

        // Обработка ввода
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const rawCommand = input.value;
                const command = rawCommand.trim().toLowerCase();
                
                if (rawCommand.trim() !== '') {
                    commandHistory.push(rawCommand);
                    historyIndex = commandHistory.length;
                    printLine(rawCommand, true);
                }

                if (command === 'clear') {
                    output.innerHTML = '';
                } else if (commands[command]) {
                    const response = commands[command];
                    if (response === '__CLEAR__') {
                        output.innerHTML = '';
                    } else {
                        printLine(response);
                    }
                } else if (command !== '') {
                    printLine(`Command not found: <b>${command}</b>. Type <span style="color:#58a6ff">"help"</span> for list.`);
                }

                input.value = '';
                updateCursorPosition();
                scrollToBottom();
            }
            
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = commandHistory[historyIndex];
                    updateCursorPosition();
                }
            }
            
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    input.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    input.value = '';
                }
                updateCursorPosition();
            }
        });

        // Обновление курсора при вводе
        input.addEventListener('input', updateCursorPosition);
        
        // Обновление курсора при ресайзе окна
        window.addEventListener('resize', updateCursorPosition);

        // Возврат фокуса при клике
        document.addEventListener('click', () => {
            input.focus();
        });

        document.addEventListener('touchstart', () => {
            input.focus();
        }, { passive: true });
    </script>
</body>
</html>
