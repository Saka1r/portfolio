<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sakair@portfolio</title>
    <style>
        /* === CSS STYLES === */
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            line-height: 1.5;
        }

        #output {
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        #output a {
            color: #58a6ff;
            text-decoration: none;
        }
        #output a:hover {
            text-decoration: underline;
        }

        .input-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .prompt {
            color: #ff7b72;
            margin-right: 8px;
            white-space: nowrap;
        }

        
        .input-wrapper {
            display: flex;
            flex-grow: 1;
            align-items: center;
            min-width: 0;
        }

        input {
            background: transparent;
            border: none;
            color: #00ff41;
            font-family: inherit;
            font-size: inherit;
            width: 100%;
            outline: none;
            caret-color: transparent;
            min-width: 50px;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: #00ff41;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            flex-shrink: 0;
        }

        @keyframes blink { 50% { opacity: 0; } }
        
        .command-history {
            color: #8b949e;
            margin: 2px 0;
        }

        /* Адаптив для мобильных */
        @media (max-width: 600px) {
            body { font-size: 14px; padding: 10px; }
            .prompt { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="output"></div>
    
    <div class="input-line">
        <span class="prompt">sakair@portfolio:~$</span>
        <div class="input-wrapper">
            <input type="text" id="command-input" autocomplete="off" autofocus>
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        // === JS LOGIC ===
        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        // База команд 
        const commands = {
            'about': 'Student (10th grade) interested in CS & TechPhys.<br>Programming since ~2021: from visual scripting to C/Rust.<br><br>I love to study and create<br>I enjoy understanding how systems work and building small projects to learn.',
            
            'skills': '<b>Languages:</b> C (K&R), Python, Rust (learning), Bash<br><b>Concepts:</b> Algorithms, Git, RISC-V basics<br><b>Systems:</b> Arch Linux, CLI workflows<br><b>Hardware:</b> ESP32, RPi, 3D printing<br><i>Always learning something new.</i>',
            
            'projects': '1. <a href="https://github.com/Saka1r" target="_blank">fu</a> — Learning project: exploring VCS internals in C++<br>2. <a href="https://github.com/Saka1r" target="_blank">Jarvis</a> — Experimenting with local voice assistants (Python)<br>3. <a href="https://github.com/Saka1r" target="_blank">Chip-8</a> — Simple emulator in Rust to understand CPU basics<br> All projects are educational — code may be messy 😅</i>',
            
            'education': '🎓 School: 10th grade, focus on math & physics<br>🔬 Kvantorium: 2 years, learned teamwork & project basics<br>📚 Self-study: "The C Programming Language", "Grokking Algorithms", RISC-V docs<br>',
            
            'hardware': '🐧 Daily driver: Arch Linux + Hyprland<br>📦 Boards: Orange Pi Zero 3, Raspberry Pi Zero 2W<br>🎮 Microcontrollers: ESP32, Arduino (for fun projects)<br>🖨 3D Printing: Modeling & printing parts for my setups',
            
            'security': '🔐 Interest: Cybersecurity fundamentals<br>🧰 Learning: nmap, Wireshark basics, network protocols, <br>⚠️ All experiments are in isolated lab environments only.',
            
            'books': '📖 Finished: "Grokking Algorithms", "The C Programming Language" (K&R)<br>📖 Reading: "Rust in Action", "Digital Circuitry and Computer Architecture", "Clean Code"<br>📖 Next: "Programming World: Algorithms", "Assembly and the x86 Digital Model"',
            
            'neofetch': `
       /\\      sakair@portfolio
      /  \\     ----------------
     /    \\    OS: Arch Linux
    /------\\   Host: Student Laptop
   /|      |\\  Kernel: Learning Mode
  / |      | \\ Uptime: 16 years
    |      |   Packages: 4y coding journey
    |      |   Shell: bash
    |______|   Resolution: Growing Daily
                DE: Hyprland
                WM: i3-like vibes
            `,
            
            'contact': '📧 Email: sakairlinux@gmail.com<br>🐙 GitHub: <a href="https://github.com/Saka1r" target="_blank">github.com/Saka1r</a><br><i>Always open to feedback and learning from others.</i>',
            
            'help': 'Available commands:<br>• about, skills, projects<br>• education, hardware, security<br>• books, contact, neofetch<br>• clear, help',
            
            'clear': '__CLEAR__', // Специальный маркер
            'sudo': 'Nice try! But this system runs on humility mode 😊',
            'matrix': 'Wake up, Neo... (Just kidding, but have a nice day!)',
            'exit': 'You cannot leave. The learning never stops. 🔁'
        };

        // Приветствие при загрузке
        window.onload = () => {
            printLine('Welcome to sakair\'s terminal portfolio.');
            printLine('Type <span style="color:#58a6ff">"help"</span> to see available commands.');
            printLine('');
        };

        // Функция вывода строки
        function printLine(text, isCommand = false) {
            const line = document.createElement('div');
            if (isCommand) {
                line.className = 'command-history';
                line.innerHTML = `<span class="prompt">sakair@portfolio:~$</span> ${text}`;
            } else {
                line.innerHTML = text;
            }
            output.appendChild(line);
            scrollToBottom();
        }

        // Прокрутка вниз
        function scrollToBottom() {
            window.scrollTo(0, document.body.scrollHeight);
        }

        // Обработка ввода
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const rawCommand = input.value;
                const command = rawCommand.trim().toLowerCase();
                
                // Показываем введённую команду в истории
                if (rawCommand.trim() !== '') {
                    printLine(rawCommand, true);
                }

                // Логика выполнения
                if (command === 'clear') {
                    output.innerHTML = '';
                } else if (commands[command]) {
                    const response = commands[command];
                    if (response === '__CLEAR__') {
                        output.innerHTML = '';
                    } else {
                        printLine(response);
                    }
                } else if (command !== '') {
                    printLine(`Command not found: <b>${command}</b>. Type <span style="color:#58a6ff">"help"</span> for list.`);
                }

                input.value = '';
                scrollToBottom();
            }
        });

        // Возврат фокуса при клике в любом месте
        document.addEventListener('click', () => {
            input.focus();
        });

        // Фокус при загрузке (для мобильных)
        document.addEventListener('touchstart', () => {
            input.focus();
        }, { passive: true });
    </script>
</body>
</html>
